<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" data-archetype="fan" aria-labelledby="bi-title bi-desc"><title id="bi-title">One desktop, shared</title><desc id="bi-desc">Two roles, one desktop.</desc><style>:root{color-scheme:light}.ink{stroke:#101b23}.title,.sub,.label,.app{font-family:system-ui,sans-serif;fill:#e9f6f5;text-anchor:middle}.title{font-size:28px;font-weight:800;letter-spacing:-.5px}.sub{font-size:21px;font-weight:600}.label{font-size:22px;font-weight:800}.app{font-size:23px;font-weight:750}.route{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:7 13;animation:stream 3.4s linear infinite}.eyePulse{transform-box:fill-box;transform-origin:center;animation:breathe 2.4s ease-in-out infinite}.tap{transform-box:fill-box;transform-origin:center;animation:tap 2.4s ease-in-out infinite}.ready{transform-box:fill-box;transform-origin:center;animation:none}.check{fill:none;stroke:#101b23;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:42;animation:none}@keyframes stream{to{stroke-dashoffset:-40}}@keyframes breathe{50%{transform:scale(1.08)}}@keyframes tap{45%,55%{transform:translate(4px,5px) scale(.94)}}@keyframes arrive{0%,20%{transform:translateY(7px);opacity:.45}45%,100%{transform:none;opacity:1}}@keyframes draw{0%,25%{stroke-dashoffset:42}55%,100%{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.route,.eyePulse,.tap,.ready,.check{animation:none}.check{stroke-dashoffset:0}}</style><defs><linearGradient id="big-idea-glass" x2="1" y2="1"><stop stop-color="#173242"/><stop offset="1" stop-color="#0a1824"/></linearGradient></defs><rect width="400" height="460" rx="30" fill="url(#big-idea-glass)" stroke="#426476" stroke-width="1"/><text class="title" x="200" y="39">One desktop, shared</text><text class="sub" x="200" y="69">Same screen. Two roles.</text><g class="eyePulse" aria-label="You watch"><path d="M32 112c18-25 39-35 58-35s40 10 58 35c-18 25-39 35-58 35s-40-10-58-35Z" fill="#ffd18b" stroke="#426779" stroke-width="6"/><circle cx="90" cy="112" r="17" fill="#153040" stroke="#426779" stroke-width="6"/><circle cx="90" cy="112" r="7" fill="#10232f"/></g><text class="label" x="90" y="178">You watch</text><g class="tap" aria-label="Assistant acts"><path d="M278 78v62l16-14 12 25 17-8-12-25 23-1Z" fill="#72f4d1" stroke="#426779" stroke-width="6" stroke-linejoin="round"/><path d="M341 88l8-7M345 108h12" fill="none" stroke="#426779" stroke-width="6" stroke-linecap="round"/></g><text class="label" x="300" y="178">Assistant acts</text><path class="route" d="M90 194C94 213 111 219 132 226" stroke="#ffd18b"/><path class="route" d="M300 194C297 212 283 219 266 226" stroke="#4be3c8"/><g aria-label="Shared desktop with finished app"><rect x="44" y="224" width="312" height="167" rx="19" fill="#10232f"/><rect x="61" y="241" width="278" height="128" rx="10" fill="#153040"/><circle cx="78" cy="257" r="5" fill="#ffd18b"/><circle cx="95" cy="257" r="5" fill="#72f4d1"/><path d="M61 274h278" stroke="#426779" stroke-width="5"/><g class="ready"><circle cx="116" cy="322" r="30" fill="#72f4d1" stroke="#426779" stroke-width="6"/><path class="check" d="m100 322 11 11 22-25"/><text class="app" x="234" y="329">App is ready</text></g><path d="M169 391h62l10 32H159Z" fill="#10232f"/><path d="M137 425h126" stroke="#426779" stroke-width="13" stroke-linecap="round"/></g></svg>