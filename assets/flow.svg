<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 678 817" width="678" height="817" role="img" aria-labelledby="d-title d-desc">
  <title id="d-title">ruos — Process / Data Flow</title>
  <desc id="d-desc">A tool call travels from client request to on-screen action and back as a JSON-RPC reply.</desc>
  <metadata><![CDATA[
Client sends JSON-RPC tool call -> ruos-mcp parses request over stdio -> Dispatch to xdotool/scrot/shell or executor -> Action runs in the live X session -> Result returned as JSON-RPC reply
]]></metadata>
  <style>
    .flow-line { stroke-dasharray: 8 10; stroke-width: 3; animation: flow-dash 1.1s linear infinite; }
    @keyframes flow-dash { to { stroke-dashoffset: -36; } }
    .node-pulse { transform-box: fill-box; transform-origin: center; animation: node-pulse 2.1s cubic-bezier(0.4,0,0.2,1) infinite; }
    @keyframes node-pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.6); } }
    @media (prefers-reduced-motion: reduce) { .flow-line, .node-pulse { animation: none; } }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0b1018"/><stop offset="0.55" stop-color="#0a0e15"/><stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.02" r="0.8">
      <stop offset="0" stop-color="rgba(75,227,200,0.1)"/><stop offset="0.5" stop-color="rgba(75,227,200,0.025)"/><stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.09)"/><stop offset="0.5" stop-color="rgba(255,255,255,0.015)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.014)"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="glowS" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="cardSh" x="-40%" y="-50%" width="180%" height="210%">
      <feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <!-- concept archetype: column -->
  <rect x="0" y="0" width="678" height="817" fill="url(#bg)"/>
  <rect x="0" y="0" width="678" height="817" fill="url(#spot)"/>
  <rect x="0" y="0" width="678" height="817" fill="url(#grid)"/>
