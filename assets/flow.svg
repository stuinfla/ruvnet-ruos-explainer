<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" data-archetype="journey" aria-labelledby="fl-title fl-desc"><title id="fl-title">The visible action loop</title><desc id="fl-desc">A visible action loop.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="m1 1 8 4-8 4Z" fill="#101b23"/></marker></defs><style>.title,.sub,.stage,.screen{font-family:system-ui,sans-serif;fill:#101b23;text-anchor:middle}.title{font-size:28px;font-weight:800;letter-spacing:-.6px}.sub{font-size:21px;font-weight:650}.stage{font-size:21px;font-weight:800}.screen{font-size:21px;font-weight:750}.loop{fill:none;stroke:#101b23;stroke-width:5;stroke-linecap:round;marker-end:url(#arrow);stroke-dasharray:12 9;animation:travel 5.5s linear infinite}.fill{transform-box:fill-box;transform-origin:left;animation:fill 5.5s ease-in-out infinite}.next{animation:next 5.5s ease-in-out infinite}.done{opacity:0;animation:done 5.5s ease-in-out infinite}.pointer{transform-box:fill-box;transform-origin:center;animation:click 5.5s ease-in-out infinite}.fresh{animation:none;transform-box:fill-box;transform-origin:center}@keyframes travel{to{stroke-dashoffset:-84}}@keyframes fill{0%,24%{transform:scaleX(.18)}55%,100%{transform:scaleX(1)}}@keyframes next{0%,40%{opacity:1}52%,100%{opacity:0}}@keyframes done{0%,46%{opacity:0}58%,100%{opacity:1}}@keyframes click{0%,22%,48%,100%{opacity:0;transform:translate(18px,12px)}30%{opacity:1;transform:translate(0)}38%{opacity:1;transform:translate(3px,4px) scale(.9)}}@keyframes fresh{0%,58%{transform:scale(.92);opacity:.55}72%,100%{transform:none;opacity:1}}@media (prefers-reduced-motion:reduce){.loop,.fill,.next,.done,.pointer,.fresh{animation:none}.fill{transform:scaleX(1)}.next,.pointer{opacity:0}.done,.fresh{opacity:1}}</style><rect width="400" height="460" rx="30" fill="#f5eedf"/><text class="title" x="200" y="38" textLength="330" lengthAdjust="spacingAndGlyphs">The visible action loop</text><text class="sub" x="200" y="67">Example: app installer</text><path class="loop" d="M326 148C375 166 383 219 344 248"/><path class="loop" d="M354 371C321 397 273 397 245 389"/><path class="loop" d="M156 387C123 380 94 361 80 344"/><path class="loop" d="M58 244C21 218 27 164 74 146"/><g aria-label="Example installer screen"><rect x="74" y="82" width="252" height="153" rx="18" fill="#101b23"/><rect x="88" y="96" width="224" height="125" rx="10" fill="#f5eedf"/><text class="screen" x="200" y="124">Example installer</text><rect x="101" y="139" width="198" height="17" rx="8.5" fill="#101b23" opacity=".18"/><rect class="fill" x="101" y="139" width="198" height="17" rx="8.5" fill="#4be3c8" stroke="#101b23" stroke-width="3"/><g class="next"><rect x="134" y="170" width="132" height="40" rx="20" fill="#ffd18b" stroke="#101b23" stroke-width="5"/><text class="screen" x="200" y="198">Next</text></g><g class="done"><rect x="134" y="170" width="132" height="40" rx="20" fill="#4be3c8" stroke="#101b23" stroke-width="5"/><path d="m158 190 8 8 14-17" fill="none" stroke="#101b23" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="screen" x="222" y="198">Done</text></g><path class="pointer" d="m247 178 1 26 7-7 7 12 8-5-7-12 10-1Z" fill="#101b23" stroke="#f5eedf" stroke-width="2"/></g><g aria-label="Assistant chooses next action"><path d="m330 236 26 25-26 25-26-25Z" fill="#4be3c8" stroke="#101b23" stroke-width="6"/><path d="m321 262 7 7 13-17" fill="none" stroke="#101b23" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="stage" x="322" y="309">AI assistant</text><text class="stage" x="322" y="334">chooses next</text></g><g class="fresh" aria-label="Fresh screen picture returns"><rect x="45" y="239" width="54" height="42" rx="8" fill="#4be3c8" stroke="#101b23" stroke-width="6"/><path d="M56 269 67 257l9 8 8-10 6 14Z" fill="#f5eedf" stroke="#101b23" stroke-width="4" stroke-linejoin="round"/><text class="stage" x="78" y="309">Fresh picture</text><text class="stage" x="78" y="334">returns</text></g><g aria-label="ruos-mcp tools send click"><path d="M165 363h70a13 13 0 0 1 0 26h-70a13 13 0 0 1 0-26Z" fill="#ffd18b" stroke="#101b23" stroke-width="6"/><circle cx="180" cy="376" r="5" fill="#101b23"/><circle cx="200" cy="376" r="5" fill="#101b23"/><circle cx="220" cy="376" r="5" fill="#101b23"/><text class="stage" x="200" y="418">ruos-mcp tools</text><text class="stage" x="200" y="444">send the click</text></g></svg>