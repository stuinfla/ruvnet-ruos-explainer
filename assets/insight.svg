<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 691 507.1766773367914" width="691" height="507.1766773367914" role="img" aria-labelledby="d-title d-desc">
  <title id="d-title">ruos — The Insight</title>
  <desc id="d-desc">Security isn't a port to lock down — it's simply who is allowed to open the SSH session.</desc>
  <metadata><![CDATA[
No socket ever opened -> SSH session is the trust boundary -> Desktop obeys like a local user
]]></metadata>
